{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}404 - Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-muted mb-2">404</div>
    <h3 class="fw-bold mb-3">Page Not Found</h3>
    <p class="text-muted mb-4">The financial record or page you requested does not exist or has been moved.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
